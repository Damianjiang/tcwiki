<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" id="theme-link">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    .sidebar-nav li a::before {
      margin-right: 8px;
    }
    .app-name {
      padding: 20px 0;
      text-align: center;
    }
    .app-name::before {
      content: '';
      display: block;
      width: 60px;
      height: 60px;
      margin: 0 auto 10px;
      background-image: url('logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    .markdown-section {
      max-width: 900px;
    }
    .pagination {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    #dark-mode-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      width: 40px;
      height: 40px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 18px;
      background: #fff;
      color: #333;
    }
    body.dark-theme {
      background-color: #111;
      color: #ddd;
    }
    body.dark-theme .sidebar {
      background-color: #1a1a1a;
      border-right-color: #333;
    }
    body.dark-theme .sidebar-nav a {
      color: #999;
    }
    body.dark-theme .sidebar-nav a:hover,
    body.dark-theme .sidebar-nav a.active {
      color: #fff;
    }
    body.dark-theme .markdown-section pre,
    body.dark-theme .markdown-section code {
      background-color: #2a2a2a;
    }
    body.dark-theme .markdown-section h1,
    body.dark-theme .markdown-section h2,
    body.dark-theme .markdown-section h3,
    body.dark-theme .markdown-section h4,
    body.dark-theme .markdown-section h5,
    body.dark-theme .markdown-section h6 {
      color: #eee;
    }
    body.dark-theme .markdown-section a {
      color: #fff;
    }
    body.dark-theme .markdown-section strong {
      color: #fff;
    }
    body.dark-theme .pagination-item {
      color: #999;
    }
    body.dark-theme .search input {
      background-color: #2a2a2a;
      border-color: #444;
      color: #ddd;
    }
    body.dark-theme .search input::placeholder {
      color: #666;
    }
    body.dark-theme .search-results {
      background-color: #1a1a1a;
    }
    body.dark-theme .search-results .matching {
      color: #fff;
    }
    body.dark-theme #dark-mode-toggle {
      background: #333;
      color: #ddd;
      border-color: #555;
    }
    body.dark-theme .pagination {
      border-top-color: #333;
    }
  </style>
</head>
<body>
  <button id="dark-mode-toggle" title="切换主题">
    <i class="fa fa-moon-o"></i>
  </button>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Wiki',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,
      auto2top: true,
      onlyCover: false,
      autoHeader: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档',
        noData: '没有找到结果',
        depth: 6
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
  <script>
    const toggleButton = document.getElementById('dark-mode-toggle');
    const body = document.body;
    let isDark = localStorage.getItem('dark-theme') === 'true';

    function applyTheme(dark) {
      if (dark) {
        body.classList.add('dark-theme');
        toggleButton.innerHTML = '<i class="fa fa-sun-o"></i>';
      } else {
        body.classList.remove('dark-theme');
        toggleButton.innerHTML = '<i class="fa fa-moon-o"></i>';
      }
      localStorage.setItem('dark-theme', dark);
    }

    applyTheme(isDark);

    toggleButton.addEventListener('click', () => {
      isDark = !isDark;
      applyTheme(isDark);
    });
  </script>
</body>
</html>
