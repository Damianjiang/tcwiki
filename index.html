<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Wiki">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --bg: #fff;
      --fg: #000;
      --muted: #666;
      --border: #e5e5e5;
      --code-bg: #f5f5f5;
    }
    .dark {
      --bg: #000;
      --fg: #fff;
      --muted: #999;
      --border: #222;
      --code-bg: #111;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg) !important;
      color: var(--fg);
      transition: background 0.2s, color 0.2s;
    }
    /* 封面页 */
    .cover {
      background: var(--bg) !important;
      background-image: none !important;
    }
    .cover h1 {
      color: var(--fg) !important;
      font-weight: 600;
    }
    .cover p {
      color: var(--muted) !important;
    }
    .cover a {
      color: var(--fg) !important;
      border: 1px solid var(--border);
      padding: 8px 20px;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .cover a:hover {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    .cover-show .cover {
      display: flex;
    }
    /* 侧边栏 */
    .sidebar {
      background: var(--bg) !important;
      border-right: 1px solid var(--border);
      padding-top: 60px;
    }
    .sidebar-toggle {
      background: var(--bg) !important;
      color: var(--fg);
      border: none;
    }
    .sidebar-toggle-button {
      color: var(--fg);
    }
    .sidebar-nav a {
      color: var(--muted) !important;
      font-size: 14px;
    }
    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      color: var(--fg) !important;
    }
    .sidebar-nav > ul > li > p {
      font-weight: 600;
      color: var(--fg);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 24px;
    }
    .sidebar-nav > ul > li > ul {
      padding-left: 0;
    }
    .sidebar-nav > ul > li > ul > li {
      list-style: none;
    }
    .sidebar-nav .folder::before {
      border-color: var(--muted);
    }
    .app-name {
      padding: 0 0 20px 0;
    }
    .app-name-link {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      color: var(--fg) !important;
    }
    .app-name-link img {
      width: 28px;
      height: 28px;
    }
    /* 内容区 */
    .markdown-section {
      max-width: 800px;
      padding: 40px 60px;
      color: var(--fg);
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6 {
      color: var(--fg);
      font-weight: 600;
      border-bottom: none;
    }
    .markdown-section h1 { font-size: 32px; margin-bottom: 24px; }
    .markdown-section h2 { font-size: 24px; margin-top: 48px; }
    .markdown-section h3 { font-size: 18px; margin-top: 32px; }
    .markdown-section p {
      color: var(--fg);
      line-height: 1.7;
    }
    .markdown-section a {
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .markdown-section a:hover {
      background: var(--fg);
      color: var(--bg);
    }
    .markdown-section code {
      background: var(--code-bg);
      color: var(--fg);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 13px;
    }
    .markdown-section pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }
    .markdown-section pre code {
      background: none;
      padding: 0;
    }
    .markdown-section blockquote {
      border-left: 3px solid var(--fg);
      background: var(--code-bg);
      color: var(--muted);
      padding: 12px 16px;
      margin: 16px 0;
    }
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
    }
    .markdown-section th,
    .markdown-section td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }
    .markdown-section th {
      background: var(--code-bg);
      font-weight: 600;
    }
    .markdown-section tr:nth-child(even) {
      background: var(--code-bg);
    }
    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }
    .markdown-section img {
      background: var(--bg);
    }
    .markdown-section ul,
    .markdown-section ol {
      color: var(--fg);
    }
    .markdown-section li {
      color: var(--fg);
    }
    /* 搜索 */
    .search {
      background: var(--bg) !important;
      border-bottom: 1px solid var(--border);
      padding: 12px 15px;
    }
    .search input {
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
    }
    .search input:focus {
      outline: none;
      border-color: var(--fg);
    }
    .search input::placeholder {
      color: var(--muted);
    }
    .search .results-panel {
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .search .matching {
      background: var(--code-bg);
      color: var(--fg);
    }
    .search h2 {
      color: var(--fg);
      margin: 0;
    }
    .search p {
      color: var(--muted);
    }
    .search a {
      color: var(--fg);
    }
    /* 分页 */
    .pagination-item {
      color: var(--muted) !important;
    }
    .pagination-item:hover {
      color: var(--fg) !important;
    }
    .pagination-item-title {
      font-size: 14px;
    }
    /* 代码复制按钮 */
    .docsify-copy-code-button {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      font-size: 12px;
      padding: 4px 8px;
    }
    .docsify-copy-code-button:hover {
      background: var(--fg);
      color: var(--bg);
    }
    /* 主题切换按钮 */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: transform 0.15s;
    }
    .theme-toggle:hover {
      transform: scale(1.05);
    }
    /* 移动端适配 */
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="切换主题">
    <span id="themeIcon">◐</span>
  </button>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<img src="logo.png" alt="Logo">TCraft WIKI',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,
      auto2top: true,
      onlyCover: true,
      autoHeader: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索',
        noData: '无结果',
        depth: 6
      },
      pagination: {
        previousText: '← 上一篇',
        nextText: '下一篇 →',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '失败',
        successText: '已复制'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2"></script>
  <script>
    const toggle = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.body.classList.add('dark');
      icon.textContent = '◑';
    }
    toggle.addEventListener('click', function() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      icon.textContent = isDark ? '◑' : '◐';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
